name = "flow_analysis"
version = "0.1.0"
defaultTargets = ["DartLang", "DartSemantics", "FlowSoundness", "flow_analysis"]
testDriver = "Tests"

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.34.1"

[[require]]
name = "iris"
git.url = "https://github.com/leanprover-community/iris-lean.git"
git.subDir = "Iris"
rev = "v4.34.1"

# In `DartLang`, `DartSemantics`, `FlowSoundness` and `Tests`, warnings are errors. In particular, a
# `sorry` fails the build, including one that Lean inserts silently: a `local notation` that
# mentions a section variable, used in a `variable` binder, elaborates that variable to `sorry`
# without an error.
[[lean_lib]]
name = "DartLang"
leanOptions = { warningAsError = true }

[[lean_lib]]
name = "DartSemantics"
leanOptions = { warningAsError = true }

[[lean_lib]]
name = "FlowAnalysis"

# The proof that flow analysis is sound: it connects `FlowAnalysis` to `DartSemantics`. It's a
# library of its own, so that `FlowAnalysis` doesn't depend on `DartSemantics` (and iris-lean).
[[lean_lib]]
name = "FlowSoundness"
leanOptions = { warningAsError = true }

# Tests: the package's `testDriver`, so `lake test` builds this library, and fails if any check
# in it fails.
[[lean_lib]]
name = "Tests"
leanOptions = { warningAsError = true }

[[lean_exe]]
name = "flow_analysis"
root = "Main"
